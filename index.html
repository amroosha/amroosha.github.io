<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#161320" />
    <meta name="description" content="Omar Ez-Eldin Abdullah — AI Engineer and Computer Science graduate building agentic AI, retrieval, computer vision, and local inference systems." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231b1533'/%3E%3Ccircle cx='32' cy='32' r='16' fill='none' stroke='%237a6cff' stroke-width='2'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%237a6cff'/%3E%3C/svg%3E" />
    <title>Omar Ez-Eldin Abdullah — AI Engineer</title>
    <script>
      // Runs before first paint so the page never flashes the wrong theme.
      (function () {
        try {
          var stored = window.localStorage.getItem('oea-theme');
          if (stored === 'light') document.documentElement.classList.remove('dark');
          else document.documentElement.classList.add('dark');
        } catch (error) {
          /* keep the default dark class already on <html> */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
